name: One-time OpenJarvis import
on:
  push:
    branches: [master]
    paths: ['.github/workflows/import-openjarvis.yml']
permissions:
  contents: write
concurrency:
  group: import-openjarvis
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'kishore2209/friday'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Copy and verify pinned OpenJarvis snapshot
        env:
          UPSTREAM_SHA: 6e4defd33fb3332eed17be1169c4bb3a6e1a274c
        run: |
          set -eu
          test ! -e OpenJarvis
          git clone --no-checkout https://github.com/open-jarvis/OpenJarvis.git "$RUNNER_TEMP/openjarvis-source"
          git -C "$RUNNER_TEMP/openjarvis-source" checkout --detach "$UPSTREAM_SHA"
          python3 - <<'PY'
          import os, subprocess, shutil, hashlib, pathlib
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "openjarvis-source"
          dst = pathlib.Path.cwd() / "OpenJarvis"
          paths = subprocess.check_output(["git","-C",str(src),"ls-files","-z"]).decode().split("\0")
          count = 0
          for path in filter(None, paths):
              source, target = src / path, dst / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              assert hashlib.sha256(source.read_bytes()).digest() == hashlib.sha256(target.read_bytes()).digest(), path
              count += 1
          pathlib.Path("OPENJARVIS_IMPORT.md").write_text(
              "# OpenJarvis import\n\nSource: https://github.com/open-jarvis/OpenJarvis\n\n"
              "Commit: " + os.environ["UPSTREAM_SHA"] + "\n\n"
              "All " + str(count) + " tracked upstream files copied into OpenJarvis/ and SHA-256 verified.\n\n"
              "Original Friday files preserved. Upstream workflows are nested and do not execute. "
              "This is a source import only; no application has been hosted.\n"
          )
          print(f"Verified {count} upstream files")
          PY
      - name: Commit import
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force OpenJarvis OPENJARVIS_IMPORT.md
          git commit -m "Import verified OpenJarvis snapshot in OpenJarvis folder"
          git push origin HEAD:master
